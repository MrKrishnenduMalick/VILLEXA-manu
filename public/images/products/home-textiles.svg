<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#1a2e56" stopOpacity="0.8"/>
      <stop offset="100%" stopColor="#081020" stopOpacity="1"/>
    </radialGradient>
    <linearGradient id="towel1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#eedec8"/>
      <stop offset="50%" stopColor="#d1bba2"/>
      <stop offset="100%" stopColor="#a38b72"/>
    </linearGradient>
    <linearGradient id="towel2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#d9b8a6"/>
      <stop offset="50%" stopColor="#b68972"/>
      <stop offset="100%" stopColor="#7e5340"/>
    </linearGradient>
    <linearGradient id="towel3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f7ede2"/>
      <stop offset="50%" stopColor="#dec8b5"/>
      <stop offset="100%" stopColor="#bfa58d"/>
    </linearGradient>
    <linearGradient id="towel4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#c5a898"/>
      <stop offset="50%" stopColor="#8d6c59"/>
      <stop offset="100%" stopColor="#583c2e"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fde68a"/>
      <stop offset="50%" stopColor="#d97706"/>
      <stop offset="100%" stopColor="#fef3c7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!--  -->
  <rect width="400" height="300" fill="url(#bgGlow)"/>

  <!--  -->
  <ellipse cx="200" cy="250" rx="160" ry="25" fill="#e5a93c" fill-opacity="0.12" filter="blur(10px)"/>

  <!--  -->
  <!--  -->
  <g filter="url(#shadow)">
    <rect x="75" y="200" width="250" height="42" rx="14" fill="url(#towel4)"/>
    <path d="M 85 200 Q 200 205 315 200" stroke="#f7ede2" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="95" y1="222" x2="305" y2="222" stroke="#42281c" stroke-opacity="0.4" stroke-dasharray="2 3"/>
  </g>

  <!--  -->
  <g filter="url(#shadow)">
    <rect x="85" y="165" width="230" height="38" rx="12" fill="url(#towel2)"/>
    <path d="M 95 165 Q 200 170 305 165" stroke="#f7ede2" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="105" y1="184" x2="295" y2="184" stroke="#5a3928" stroke-opacity="0.4" stroke-dasharray="2 3"/>
  </g>

  <!--  -->
  <g filter="url(#shadow)">
    <rect x="95" y="130" width="210" height="38" rx="12" fill="url(#towel1)"/>
    <path d="M 105 130 Q 200 135 295 130" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2"/>
    <line x1="115" y1="149" x2="285" y2="149" stroke="#7e5340" stroke-opacity="0.4" stroke-dasharray="2 3"/>
  </g>

  <!--  -->
  <g filter="url(#shadow)">
    <rect x="105" y="95" width="190" height="38" rx="12" fill="url(#towel3)"/>
    <path d="M 115 95 Q 200 100 285 95" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
    <line x1="125" y1="114" x2="275" y2="114" stroke="#8d6c59" stroke-opacity="0.3" stroke-dasharray="2 3"/>
  </g>

  <!--  -->
  <rect x="190" y="88" width="20" height="154" fill="url(#ribbonGold)" opacity="0.9" rx="2" filter="url(#shadow)"/>
  <!--  -->
  <ellipse cx="200" cy="88" rx="14" ry="7" fill="url(#ribbonGold)"/>
  <circle cx="200" cy="88" r="4" fill="#fef08a"/>

  <!--  -->
  <g transform="translate(145, 60) scale(0.6)" opacity="0.85">
    <path d="M 40 40 Q 30 10 0 0" stroke="#a38b72" stroke-width="3" fill="none"/>
    <circle cx="3" cy="2" r="10" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="-5" cy="8" r="8" fill="#f7ede2"/>
    <circle cx="10" cy="8" r="8" fill="#f7ede2"/>
    <circle cx="2" cy="12" r="6" fill="#dec8b5"/>
  </g>
</svg>

