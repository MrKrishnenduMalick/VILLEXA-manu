<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="fabricBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stopColor="#251633" stopOpacity="0.9"/>
      <stop offset="100%" stopColor="#080714" stopOpacity="1"/>
    </radialGradient>
    <linearGradient id="purpleRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8e24aa"/>
      <stop offset="50%" stopColor="#58126b"/>
      <stop offset="100%" stopColor="#2b0538"/>
    </linearGradient>
    <linearGradient id="goldRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef3c7"/>
      <stop offset="50%" stopColor="#d4af37"/>
      <stop offset="100%" stopColor="#8c6d1f"/>
    </linearGradient>
    <linearGradient id="creamRoll" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f7f3e9"/>
      <stop offset="50%" stopColor="#d5c7b3"/>
      <stop offset="100%" stopColor="#9a8770"/>
    </linearGradient>
    <filter id="rollShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-5" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#fabricBg)"/>

  <!--  -->
  <ellipse cx="220" cy="240" rx="150" ry="30" fill="#d4af37" fill-opacity="0.15" filter="blur(12px)"/>

  <!--  -->
  <g transform="translate(30, 40) rotate(-22 150 150)" filter="url(#rollShadow)">
    <!--  -->
    <path d="M 60 70 L 260 70 L 260 140 L 60 140 Z" fill="url(#purpleRoll)"/>
    <!--  -->
    <ellipse cx="60" cy="105" rx="20" ry="35" fill="#3c0b49" stroke="#ab47bc" stroke-width="2"/>
    <ellipse cx="60" cy="105" rx="8" ry="14" fill="#1d0424"/>
    <!--  -->
    <line x1="100" y1="70" x2="100" y2="140" stroke="#ab47bc" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="140" y1="70" x2="140" y2="140" stroke="#ab47bc" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="180" y1="70" x2="180" y2="140" stroke="#ab47bc" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="220" y1="70" x2="220" y2="140" stroke="#ab47bc" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!--  -->
  <g transform="translate(100, 60) rotate(-22 150 150)" filter="url(#rollShadow)">
    <!--  -->
    <path d="M 50 100 L 280 100 L 280 185 L 50 185 Z" fill="url(#creamRoll)"/>
    <!--  -->
    <path d="M 50 100 L 280 100" stroke="#ffffff" stroke-width="3" stroke-opacity="0.7"/>
    <!--  -->
    <ellipse cx="50" cy="142" rx="24" ry="42" fill="#c4b59f" stroke="#8c6d1f" stroke-width="2"/>
    <ellipse cx="50" cy="142" rx="10" ry="18" fill="#5c4933"/>
    
    <!--  -->
    <g opacity="0.35" stroke="#7a5c29" stroke-width="1.5" fill="none">
      <path d="M 90 120 Q 110 105 130 120 T 170 120"/>
      <circle cx="110" cy="120" r="8"/>
      <path d="M 150 150 Q 170 135 190 150 T 230 150"/>
      <circle cx="170" cy="150" r="8"/>
      <path d="M 210 120 Q 230 105 250 120"/>
      <circle cx="230" cy="120" r="8"/>
    </g>
  </g>

  <!--  -->
  <g transform="translate(40, 190)">
    <ellipse cx="60" cy="60" rx="35" ry="14" fill="#a16214"/>
    <path d="M 25 60 L 25 75 C 25 85 95 85 95 75 L 95 60 Z" fill="url(#goldRoll)"/>
    <line x1="60" y1="20" x2="60" y2="70" stroke="#fde68a" stroke-width="2"/>
    <!--  -->
    <path d="M 90 65 Q 160 85 240 50" stroke="#d4af37" stroke-width="2.5" fill="none" filter="url(#rollShadow)"/>
  </g>
</svg>

