<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="leatherBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stopColor="#2c1a14" stopOpacity="0.9"/>
      <stop offset="100%" stopColor="#0a0503" stopOpacity="1"/>
    </radialGradient>
    <linearGradient id="leatherTan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#df8e53"/>
      <stop offset="40%" stopColor="#aa5a24"/>
      <stop offset="100%" stopColor="#5d2a09"/>
    </linearGradient>
    <linearGradient id="leatherDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#8d4b24"/>
      <stop offset="50%" stopColor="#542407"/>
      <stop offset="100%" stopColor="#290e02"/>
    </linearGradient>
    <linearGradient id="leatherCognac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b"/>
      <stop offset="50%" stopColor="#b45309"/>
      <stop offset="100%" stopColor="#78350f"/>
    </linearGradient>
    <filter id="leatherShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="12" stdDeviation="9" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#leatherBg)"/>

  <!--  -->
  <ellipse cx="200" cy="250" rx="160" ry="25" fill="#f59e0b" fill-opacity="0.12" filter="blur(10px)"/>

  <!--  -->
  <g transform="translate(45, 65) rotate(-16 160 120)" filter="url(#leatherShadow)">
    <!--  -->
    <path d="M 60 70 L 290 70 L 290 160 L 60 160 Z" fill="url(#leatherTan)"/>
    <!--  -->
    <path d="M 60 78 L 290 78" stroke="#fcd34d" stroke-width="3" stroke-opacity="0.4"/>
    <!--  -->
    <ellipse cx="60" cy="115" rx="26" ry="45" fill="#451a03" stroke="#d97706" stroke-width="2.5"/>
    <ellipse cx="60" cy="115" rx="12" ry="22" fill="#1f0901"/>
    
    <!--  -->
    <path d="M 60 160 C 120 180, 200 150, 290 165 L 290 150 L 60 150 Z" fill="url(#leatherDark)"/>
    
    <!--  -->
    <line x1="80" y1="145" x2="280" y2="145" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.8"/>
  </g>

  <!--  -->
  <g transform="translate(60, 150)" filter="url(#leatherShadow)">
    <!--  -->
    <rect x="80" y="40" width="200" height="65" rx="8" fill="url(#leatherCognac)"/>
    <!--  -->
    <rect x="85" y="45" width="190" height="55" rx="6" fill="none" stroke="#fef3c7" stroke-width="1.8" stroke-dasharray="3 3" stroke-opacity="0.75"/>
    <!--  -->
    <rect x="165" y="48" width="30" height="20" rx="3" fill="none" stroke="#fde68a" stroke-width="3"/>
    <line x1="180" y1="48" x2="180" y2="68" stroke="#fde68a" stroke-width="3"/>
  </g>
</svg>

