<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#02050e"/>
      <stop offset="40%" stopColor="#07132a"/>
      <stop offset="70%" stopColor="#0b1e3e"/>
      <stop offset="100%" stopColor="#040914"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0a1835"/>
      <stop offset="50%" stopColor="#13274e"/>
      <stop offset="100%" stopColor="#0a152d"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fffae6" stopOpacity="0.95"/>
      <stop offset="50%" stopColor="#fcd34d" stopOpacity="0.8"/>
      <stop offset="100%" stopColor="#b45309" stopOpacity="0.6"/>
    </linearGradient>
    <linearGradient id="roadGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#fde68a" stopOpacity="0"/>
      <stop offset="30%" stopColor="#f59e0b" stopOpacity="0.8"/>
      <stop offset="70%" stopColor="#fef08a" stopOpacity="1"/>
      <stop offset="100%" stopColor="#d97706" stopOpacity="0"/>
    </linearGradient>
    <radialGradient id="hologlobeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#38bdf8" stopOpacity="0.6"/>
      <stop offset="40%" stopColor="#0284c7" stopOpacity="0.3"/>
      <stop offset="80%" stopColor="#0369a1" stopOpacity="0.1"/>
      <stop offset="100%" stopColor="#0c4a6e" stopOpacity="0"/>
    </radialGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!--  -->
  <rect width="1200" height="800" fill="url(#nightSky)"/>

  <!--  -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="80" cy="120" r="1"/>
    <circle cx="210" cy="80" r="1.5"/>
    <circle cx="340" cy="190" r="1"/>
    <circle cx="480" cy="110" r="1"/>
    <circle cx="620" cy="70" r="1.5"/>
    <circle cx="780" cy="140" r="1"/>
    <circle cx="950" cy="90" r="1"/>
    <circle cx="1120" cy="160" r="1.5"/>
  </g>

  <!--  -->
  <g transform="translate(680, 220)">
    <!--  -->
    <circle cx="0" cy="0" r="240" fill="url(#hologlobeGlow)"/>
    <!--  -->
    <circle cx="0" cy="0" r="180" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
    <ellipse cx="0" cy="0" rx="180" ry="70" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>
    <ellipse cx="0" cy="0" rx="180" ry="130" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>
    <ellipse cx="0" cy="0" rx="90" ry="180" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35"/>
    <!--  -->
    <circle cx="-60" cy="-40" r="3.5" fill="#fde68a" filter="url(#laserGlow)"/>
    <circle cx="40" cy="20" r="3" fill="#fde68a"/>
    <circle cx="100" cy="-60" r="2.5" fill="#38bdf8"/>
    <circle cx="-110" cy="30" r="3" fill="#38bdf8"/>
    <!--  -->
    <ellipse cx="0" cy="0" rx="220" ry="85" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.7" fill="none" transform="rotate(-25)" stroke-dasharray="8 4"/>
  </g>

  <!--  -->
  <!--  -->
  <g transform="translate(560, 220)">
    <!--  -->
    <polygon points="0,150 480,80 480,500 0,540" fill="url(#buildingGrad)" stroke="#1e3a6d" stroke-width="2"/>

    <!--  -->
    <polygon points="-20,145 490,75 510,85 0,160" fill="#0d1f3d" stroke="#f59e0b" stroke-width="1.5"/>

    <!--  -->
    <g transform="translate(140, 150) rotate(-7)">
      <circle cx="15" cy="15" r="10" stroke="#f59e0b" stroke-width="1.5" fill="#0d1f3d"/>
      <text x="35" y="20" fill="#ffffff" font-family="serif" font-weight="bold" font-size="20" letter-spacing="1">
        GlobalTex Exports
      </text>
    </g>

    <!--  -->
    <!--  -->
    <g fill="url(#windowGlow)" opacity="0.85">
      <polygon points="40,210 110,198 110,250 40,260"/>
      <polygon points="130,195 200,183 200,235 130,245"/>
      <polygon points="220,180 290,168 290,220 220,230"/>
      <polygon points="310,165 380,153 380,205 310,215"/>
      <polygon points="400,150 460,140 460,190 400,200"/>
    </g>

    <!--  -->
    <g fill="url(#windowGlow)" opacity="0.9">
      <polygon points="40,280 110,268 110,320 40,330"/>
      <polygon points="130,265 200,253 200,305 130,315"/>
      <polygon points="220,250 290,238 290,290 220,300"/>
      <polygon points="310,235 380,223 380,275 310,285"/>
      <polygon points="400,220 460,210 460,260 400,270"/>
    </g>

    <!--  -->
    <polygon points="30,350 470,280 470,480 30,520" fill="url(#windowGlow)" opacity="0.95"/>
    <!--  -->
    <line x1="80" y1="345" x2="80" y2="515" stroke="#0a152d" stroke-width="4"/>
    <line x1="140" y1="335" x2="140" y2="505" stroke="#0a152d" stroke-width="4"/>
    <line x1="200" y1="325" x2="200" y2="495" stroke="#0a152d" stroke-width="4"/>
    <line x1="260" y1="315" x2="260" y2="485" stroke="#0a152d" stroke-width="4"/>
    <line x1="320" y1="305" x2="320" y2="475" stroke="#0a152d" stroke-width="4"/>
    <line x1="380" y1="295" x2="380" y2="465" stroke="#0a152d" stroke-width="4"/>
    <line x1="440" y1="285" x2="440" y2="455" stroke="#0a152d" stroke-width="4"/>
  </g>

  <!--  -->
  <g transform="translate(680, 680)" opacity="0.9">
    <!--  -->
    <ellipse cx="0" cy="0" rx="30" ry="10" fill="#040914" stroke="#f59e0b" stroke-width="1"/>
    <!--  -->
    <path d="M 0 0 Q -20 -40 -40 -60 M 0 0 Q 0 -50 0 -70 M 0 0 Q 20 -40 40 -60" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    
    <g transform="translate(140, -10)">
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="#040914" stroke="#f59e0b" stroke-width="1"/>
      <path d="M 0 0 Q -25 -45 -50 -65 M 0 0 Q 0 -55 0 -75 M 0 0 Q 25 -45 50 -65" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <g transform="translate(280, -25)">
      <ellipse cx="0" cy="0" rx="30" ry="10" fill="#040914" stroke="#f59e0b" stroke-width="1"/>
      <path d="M 0 0 Q -25 -45 -50 -65 M 0 0 Q 0 -55 0 -75 M 0 0 Q 25 -45 50 -65" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!--  -->
  <polygon points="0,660 1200,600 1200,800 0,800" fill="#030712"/>
  
  <!--  -->
  <path d="M -50 780 C 300 700, 600 790, 1250 680" stroke="url(#roadGold)" stroke-width="6" fill="none" filter="url(#laserGlow)"/>
  <path d="M -50 760 C 400 680, 800 770, 1250 650" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.8" fill="none" filter="url(#laserGlow)"/>
  <path d="M -50 790 C 250 720, 750 820, 1250 710" stroke="#fef08a" stroke-width="2" stroke-opacity="0.9" fill="none"/>
</svg>

