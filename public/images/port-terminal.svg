<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="portSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#040a18"/>
      <stop offset="50%" stopColor="#0a1a36"/>
      <stop offset="85%" stopColor="#b45309" stopOpacity="0.7"/>
      <stop offset="100%" stopColor="#08142b"/>
    </linearGradient>
    <linearGradient id="shipHull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1e293b"/>
      <stop offset="70%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#881337"/>
    </linearGradient>
    <linearGradient id="seaWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#071836"/>
      <stop offset="50%" stopColor="#040d1f"/>
      <stop offset="100%" stopColor="#02060f"/>
    </linearGradient>
    <linearGradient id="waterReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f59e0b" stopOpacity="0"/>
      <stop offset="50%" stopColor="#fef08a" stopOpacity="0.8"/>
      <stop offset="100%" stopColor="#f59e0b" stopOpacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#portSky)"/>

  <!--  -->
  <ellipse cx="600" cy="270" rx="200" ry="40" fill="#f59e0b" fill-opacity="0.25" filter="blur(15px)"/>

  <!--  -->
  <g transform="translate(620, 110)" stroke="#f59e0b" stroke-width="2.5" fill="none">
    <!--  -->
    <line x1="60" y1="0" x2="60" y2="180"/>
    <line x1="100" y1="20" x2="100" y2="180"/>
    <line x1="20" y1="40" x2="140" y2="40"/>
    <line x1="140" y1="40" x2="160" y2="180"/>
    <!--  -->
    <line x1="-50" y1="40" x2="140" y2="40" stroke-width="3"/>
    <line x1="-50" y1="40" x2="60" y2="0"/>
    <!--  -->
    <line x1="-10" y1="40" x2="-10" y2="90" stroke="#fef08a" stroke-width="1.5"/>
    <rect x="-22" y="90" width="24" height="14" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
    
    <!--  -->
    <g transform="translate(-80, 20) scale(0.85)" opacity="0.6">
      <line x1="60" y1="0" x2="60" y2="180"/>
      <line x1="100" y1="20" x2="100" y2="180"/>
      <line x1="-50" y1="40" x2="140" y2="40" stroke-width="3"/>
      <line x1="-50" y1="40" x2="60" y2="0"/>
    </g>
  </g>

  <!--  -->
  <g transform="translate(260, 170)">
    <!--  -->
    <!--  -->
    <rect x="180" y="30" width="40" height="18" fill="#e11d48"/>
    <rect x="225" y="30" width="40" height="18" fill="#0284c7"/>
    <rect x="270" y="30" width="40" height="18" fill="#eab308"/>
    
    <!--  -->
    <rect x="140" y="50" width="40" height="18" fill="#22c55e"/>
    <rect x="185" y="50" width="40" height="18" fill="#f97316"/>
    <rect x="230" y="50" width="40" height="18" fill="#3b82f6"/>
    <rect x="275" y="50" width="40" height="18" fill="#6366f1"/>
    <rect x="320" y="50" width="40" height="18" fill="#e11d48"/>

    <!--  -->
    <rect x="100" y="70" width="40" height="18" fill="#0284c7"/>
    <rect x="145" y="70" width="40" height="18" fill="#eab308"/>
    <rect x="190" y="70" width="40" height="18" fill="#22c55e"/>
    <rect x="235" y="70" width="40" height="18" fill="#f97316"/>
    <rect x="280" y="70" width="40" height="18" fill="#06b6d4"/>
    <rect x="325" y="70" width="40" height="18" fill="#a855f7"/>

    <!--  -->
    <rect x="60" y="90" width="40" height="18" fill="#e11d48"/>
    <rect x="105" y="90" width="40" height="18" fill="#3b82f6"/>
    <rect x="150" y="90" width="40" height="18" fill="#22c55e"/>
    <rect x="195" y="90" width="40" height="18" fill="#eab308"/>
    <rect x="240" y="90" width="40" height="18" fill="#f97316"/>
    <rect x="285" y="90" width="40" height="18" fill="#0284c7"/>
    <rect x="330" y="90" width="40" height="18" fill="#14b8a6"/>
    <rect x="375" y="90" width="40" height="18" fill="#ec4899"/>

    <!--  -->
    <polygon points="410,20 440,20 440,110 400,110" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <rect x="410" y="30" width="25" height="10" fill="#fde68a"/>
    <!--  -->
    <line x1="425" y1="5" x2="425" y2="20" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="425" cy="5" r="2.5" fill="#ef4444" class="animate-pulse"/>

    <!--  -->
    <path d="M 0 110 L 490 110 L 470 170 C 350 175, 100 175, 10 160 Z" fill="url(#shipHull)" stroke="#334155" stroke-width="1.5"/>
    <line x1="15" y1="140" x2="480" y2="140" stroke="#ef4444" stroke-width="3"/>
  </g>

  <!--  -->
  <rect x="0" y="335" width="800" height="115" fill="url(#seaWater)"/>

  <!--  -->
  <ellipse cx="600" cy="350" rx="160" ry="6" fill="url(#waterReflection)"/>
  <ellipse cx="580" cy="370" rx="120" ry="5" fill="url(#waterReflection)" opacity="0.7"/>
  <ellipse cx="620" cy="390" rx="90" ry="4" fill="url(#waterReflection)" opacity="0.5"/>
  <ellipse cx="590" cy="410" rx="60" ry="3" fill="url(#waterReflection)" opacity="0.4"/>

  <!--  -->
  <path d="M 270 335 Q 220 345 160 360" stroke="#93c5fd" stroke-width="2" stroke-opacity="0.6" fill="none"/>
</svg>

